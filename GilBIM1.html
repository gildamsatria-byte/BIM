<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini BIM</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--card:#fff;--fg:#1f2328;--mut:#6b7280;--line:#dcdad3;--ac:#0f6e56;--grid:#ebe9e3;--wall:#1f2328;--sel:#d85a30}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--fg:#ecebe6;--mut:#9a9a92;--line:#3a3a36;--ac:#4fc3a1;--grid:#2c2c29;--wall:#ecebe6;--sel:#f0997b}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--fg:#ecebe6;--mut:#9a9a92;--line:#3a3a36;--ac:#4fc3a1;--grid:#2c2c29;--wall:#ecebe6;--sel:#f0997b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
h1{font-size:17px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.card h2{font-size:12px;margin:0 0 6px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
canvas,#v3{width:100%;height:360px;display:block;border-radius:6px}
#hint{color:var(--mut);font-size:12px;margin:6px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:12px;color:var(--mut)}
input[type=number]{width:70px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:12px}
textarea{width:100%;height:110px;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.wrap{overflow-x:auto}
</style></head><body>
<h1>Mini BIM — pemodel gedung sederhana</h1>
<div class="bar" id="tools">
<button data-t="wall" class="on">Dinding</button><button data-t="door">Pintu</button><button data-t="window">Jendela</button><button data-t="select">Pilih</button>
<button id="del">Hapus terpilih</button><button id="clear">Kosongkan</button>
<span class="row"><label>Tinggi dinding</label><input type="number" id="gh" value="3" step="0.1" min="1"><label>Tebal</label><input type="number" id="gt" value="0.2" step="0.05" min="0.05"></span>
</div>
<div class="grid">
<div class="card"><h2>Denah (2D)</h2><canvas id="plan"></canvas><p id="hint"></p><div class="row" id="props"></div></div>
<div class="card"><h2>Model 3D — seret untuk putar, scroll untuk zoom</h2><div id="v3"></div></div>
</div>
<div class="grid" style="margin-top:10px">
<div class="card wrap"><h2>Schedule / kuantitas</h2><div id="sched"></div></div>
<div class="card"><h2>Data (JSON)</h2><textarea id="json" spellcheck="false"></textarea><div class="row" style="margin-top:6px"><button id="exp">Ekspor ke kotak</button><button id="imp">Muat dari kotak</button></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const S={walls:[],ops:[],id:1};
let tool='wall',start=null,hover=null,sel=null;
const $=id=>document.getElementById(id),snap=v=>Math.round(v*2)/2;
const WX=24,WY=16;
function sample(){S.walls=[[0,0,8,0],[8,0,8,6],[8,6,0,6],[0,6,0,0]].map(w=>({id:S.id++,a:[w[0]+2,w[1]+2],b:[w[2]+2,w[3]+2],h:3,t:.2}));
S.ops=[{id:S.id++,wall:S.walls[0].id,d:2.5,type:'door',w:.9,h:2.1,sill:0},{id:S.id++,wall:S.walls[1].id,d:3,type:'window',w:1.5,h:1.2,sill:.9}];}
try{const j=localStorage.getItem('minibim');if(j)Object.assign(S,JSON.parse(j));else sample()}catch(e){sample()}
function save(){try{localStorage.setItem('minibim',JSON.stringify(S))}catch(e){}}
const len=w=>Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]);
const wallOf=id=>S.walls.find(w=>w.id===id);
function proj(p,w){const L=len(w),ux=(w.b[0]-w.a[0])/L,uy=(w.b[1]-w.a[1])/L;let d=(p[0]-w.a[0])*ux+(p[1]-w.a[1])*uy;d=Math.max(0,Math.min(L,d));
return{d,dist:Math.hypot(w.a[0]+ux*d-p[0],w.a[1]+uy*d-p[1]),ux,uy}}
// ---------- 2D ----------
const cv=$('plan'),cx=cv.getContext('2d');let sc=1;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function draw(){const W=cv.clientWidth,H=cv.clientHeight,r=devicePixelRatio||1;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);
sc=Math.min(W/WX,H/WY);cx.clearRect(0,0,W,H);cx.strokeStyle=css('--grid');cx.lineWidth=1;
for(let x=0;x<=WX;x++){cx.beginPath();cx.moveTo(x*sc,0);cx.lineTo(x*sc,WY*sc);cx.stroke()}
for(let y=0;y<=WY;y++){cx.beginPath();cx.moveTo(0,y*sc);cx.lineTo(WX*sc,y*sc);cx.stroke()}
for(const w of S.walls){cx.strokeStyle=sel&&sel.k==='w'&&sel.id===w.id?css('--sel'):css('--wall');cx.lineWidth=Math.max(2,w.t*sc);cx.lineCap='butt';
cx.beginPath();cx.moveTo(w.a[0]*sc,w.a[1]*sc);cx.lineTo(w.b[0]*sc,w.b[1]*sc);cx.stroke()}
for(const o of S.ops){const w=wallOf(o.wall);if(!w)continue;const p=proj([0,0],w),ux=p.ux,uy=p.uy,c=[w.a[0]+ux*o.d,w.a[1]+uy*o.d];
cx.strokeStyle=sel&&sel.k==='o'&&sel.id===o.id?css('--sel'):(o.type==='door'?'#c8781e':'#2f8fd8');cx.lineWidth=Math.max(3,w.t*sc*.6);
cx.beginPath();cx.moveTo((c[0]-ux*o.w/2)*sc,(c[1]-uy*o.w/2)*sc);cx.lineTo((c[0]+ux*o.w/2)*sc,(c[1]+uy*o.w/2)*sc);cx.stroke();
cx.strokeStyle=css('--card');cx.lineWidth=1.5;cx.stroke()}
if(start&&hover){cx.strokeStyle=css('--ac');cx.setLineDash([6,4]);cx.lineWidth=2;cx.beginPath();cx.moveTo(start[0]*sc,start[1]*sc);cx.lineTo(hover[0]*sc,hover[1]*sc);cx.stroke();cx.setLineDash([]);
cx.fillStyle=css('--fg');cx.font='12px system-ui';cx.fillText(Math.hypot(hover[0]-start[0],hover[1]-start[1]).toFixed(2)+' m',hover[0]*sc+8,hover[1]*sc-8)}
if(hover&&tool==='wall'){cx.fillStyle=css('--ac');cx.beginPath();cx.arc(hover[0]*sc,hover[1]*sc,4,0,7);cx.fill()}}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/sc,(e.clientY-r.top)/sc]}
function nearestWall(p,max){let b=null;for(const w of S.walls){const q=proj(p,w);if(q.dist<max&&(!b||q.dist<b.q.dist))b={w,q}}return b}
cv.addEventListener('pointermove',e=>{const p=pt(e);hover=tool==='wall'?[snap(p[0]),snap(p[1])]:p;draw()});
cv.addEventListener('pointerdown',e=>{const p=pt(e);
if(tool==='wall'){const q=[snap(p[0]),snap(p[1])];if(!start)start=q;else if(q[0]!==start[0]||q[1]!==start[1]){S.walls.push({id:S.id++,a:start,b:q,h:+$('gh').value,t:+$('gt').value});start=q;commit()}}
else if(tool==='door'||tool==='window'){const n=nearestWall(p,.6);if(n){const dr=tool==='door';S.ops.push({id:S.id++,wall:n.w.id,d:n.q.d,type:tool,w:dr?.9:1.5,h:dr?2.1:1.2,sill:dr?0:.9});sel={k:'o',id:S.ops[S.ops.length-1].id};commit()}}
else{let f=null;for(const o of S.ops){const w=wallOf(o.wall),q=proj(p,w);if(q.dist<.5&&Math.abs(q.d-o.d)<o.w/2+.2)f={k:'o',id:o.id}}
if(!f){const n=nearestWall(p,.4);if(n)f={k:'w',id:n.w.id}}sel=f;props();draw()}});
addEventListener('keydown',e=>{if(e.key==='Escape'){start=null;draw()}if((e.key==='Delete'||e.key==='Backspace')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))del()});
cv.addEventListener('contextmenu',e=>{e.preventDefault();start=null;draw()});
function del(){if(!sel)return;if(sel.k==='w'){S.walls=S.walls.filter(w=>w.id!==sel.id);S.ops=S.ops.filter(o=>o.wall!==sel.id)}else S.ops=S.ops.filter(o=>o.id!==sel.id);sel=null;commit()}
$('del').onclick=del;$('clear').onclick=()=>{S.walls=[];S.ops=[];sel=null;start=null;commit()};
document.querySelectorAll('#tools [data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;start=null;document.querySelectorAll('#tools [data-t]').forEach(x=>x.classList.toggle('on',x===b));hint();draw()});
function hint(){$('hint').textContent={wall:'Klik untuk mulai dinding, klik lagi untuk titik berikutnya. Klik kanan / Esc untuk berhenti.',door:'Klik dekat dinding untuk menaruh pintu.',window:'Klik dekat dinding untuk menaruh jendela.',select:'Klik elemen untuk mengedit atau hapus (Delete).'}[tool]}
function props(){const el=$('props');el.innerHTML='';if(!sel)return;
const it=sel.k==='w'?wallOf(sel.id):S.ops.find(o=>o.id===sel.id);if(!it)return;
const f=sel.k==='w'?[['h','Tinggi'],['t','Tebal']]:[['w','Lebar'],['h','Tinggi'],['sill','Ambang'],['d','Posisi']];
for(const[k,l]of f){const lb=document.createElement('label');lb.textContent=l;const i=document.createElement('input');i.type='number';i.step='0.05';i.value=+it[k].toFixed(2);
i.onchange=()=>{it[k]=Math.max(0,+i.value);commit(true)};el.append(lb,i)}}
// ---------- 3D ----------
const v3=$('v3'),ren=new THREE.WebGLRenderer({antialias:true,alpha:true});v3.appendChild(ren.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,500),grp=new THREE.Group();scene.add(grp);
scene.add(new THREE.HemisphereLight(0xffffff,0x888888,.75));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(10,20,8);scene.add(dl);
scene.add(new THREE.GridHelper(40,40,0x999999,0xcccccc));
let az=.8,el=.6,dist=22;const tgt=new THREE.Vector3(6,1,5);
function cam3(){cam.position.set(tgt.x+dist*Math.cos(el)*Math.sin(az),tgt.y+dist*Math.sin(el),tgt.z+dist*Math.cos(el)*Math.cos(az));cam.lookAt(tgt);ren.render(scene,cam)}
function size3(){const w=v3.clientWidth,h=360;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();cam3()}
let drag=null;v3.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY]});addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=Math.max(.05,Math.min(1.5,el+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];cam3()});
v3.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(4,Math.min(80,dist*(1+e.deltaY*.001)));cam3()},{passive:false});
const mat=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
function box(g,x0,x1,y0,y1,t,m){if(x1-x0<.001||y1-y0<.001)return;const b=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,t),m);b.position.set((x0+x1)/2,(y0+y1)/2,0);g.add(b)}
function build(){while(grp.children.length)grp.remove(grp.children[0]);
const mw=mat(0xd9d4c7),md=mat(0x8a5a2b),mg=mat(0x6cb4ee,{transparent:true,opacity:.45});let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
for(const w of S.walls){const L=len(w),g=new THREE.Group();g.position.set(w.a[0],0,w.a[1]);g.rotation.y=-Math.atan2(w.b[1]-w.a[1],w.b[0]-w.a[0]);
const inner=new THREE.Group();inner.position.x=0;g.add(inner);
const ops=S.ops.filter(o=>o.wall===w.id).map(o=>({o,x0:Math.max(0,o.d-o.w/2),x1:Math.min(L,o.d+o.w/2)})).sort((a,b)=>a.x0-b.x0);
const seg=(a,b,y0,y1,m)=>{const t=new THREE.Group();box(t,0,b-a,y0,y1,w.t,m);t.children.forEach(c=>c.position.x+=a+(b-a)/2-(b-a)/2+(b-a)/2-(b-a)/2);return t};
let cur=0;const add=(x0,x1,y0,y1,m)=>{if(x1-x0<.001||y1-y0<.001)return;const b=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,w.t),m);b.position.set((x0+x1)/2,(y0+y1)/2,0);g.add(b)};
for(const p of ops){add(cur,p.x0,0,w.h,mw);const y1=Math.min(w.h,p.o.sill+p.o.h);add(p.x0,p.x1,0,p.o.sill,mw);add(p.x0,p.x1,y1,w.h,mw);
if(p.o.type==='window')add(p.x0,p.x1,p.o.sill,y1,mg);else add(p.x0,p.x1,p.o.sill,y1,md);
if(p.o.type==='door'){g.children[g.children.length-1].scale.z=.25}else g.children[g.children.length-1].scale.z=.1;cur=Math.max(cur,p.x1)}
add(cur,L,0,w.h,mw);grp.add(g);
for(const q of[w.a,w.b]){mnx=Math.min(mnx,q[0]);mny=Math.min(mny,q[1]);mxx=Math.max(mxx,q[0]);mxy=Math.max(mxy,q[1])}}
if(S.walls.length){const f=new THREE.Mesh(new THREE.BoxGeometry(mxx-mnx,.2,mxy-mny),mat(0xb8b2a4));f.position.set((mnx+mxx)/2,-.1,(mny+mxy)/2);grp.add(f);tgt.set((mnx+mxx)/2,1,(mny+mxy)/2)}
cam3()}
// ---------- schedule ----------
function sched(){let L=0,A=0,V=0;for(const w of S.walls){const l=len(w);L+=l;A+=l*w.h;V+=l*w.h*w.t}
let oa=0;for(const o of S.ops)oa+=o.w*o.h;const nd=S.ops.filter(o=>o.type==='door').length,nw=S.ops.length-nd;
const r=(a,b,c)=>`<tr><td>${a}</td><td>${b}</td><td>${c}</td></tr>`;
$('sched').innerHTML='<table><tr><th>Item</th><th>Jumlah</th><th>Satuan</th></tr>'+r('Dinding',S.walls.length,'buah')+r('Panjang total dinding',L.toFixed(2),'m')+r('Luas dinding (bruto)',A.toFixed(2),'m²')+r('Luas dinding (neto, minus bukaan)',(A-oa).toFixed(2),'m²')+r('Volume dinding (neto)',(V-oa*(S.walls[0]?S.walls[0].t:0)).toFixed(2),'m³')+r('Pintu',nd,'buah')+r('Jendela',nw,'buah')+'</table>'}
function commit(keep){save();if(!keep)props();draw();build();sched()}
$('exp').onclick=()=>{$('json').value=JSON.stringify(S,null,1)};
$('imp').onclick=()=>{try{const d=JSON.parse($('json').value);S.walls=d.walls||[];S.ops=d.ops||[];S.id=d.id||100;sel=null;commit()}catch(e){alert('JSON tidak valid')}};
addEventListener('resize',()=>{size3();draw()});hint();size3();draw();build();sched();props();
</script></body></html>
