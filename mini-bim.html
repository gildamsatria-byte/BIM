<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini BIM</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--card:#fff;--fg:#1f2328;--mut:#6b7280;--line:#dcdad3;--ac:#0f6e56;--grid:#ebe9e3;--wall:#1f2328;--sel:#d85a30;--ghost:#9c9890}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--fg:#ecebe6;--mut:#9a9a92;--line:#3a3a36;--ac:#4fc3a1;--grid:#2c2c29;--wall:#ecebe6;--sel:#f0997b;--ghost:#5c5952}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--fg:#ecebe6;--mut:#9a9a92;--line:#3a3a36;--ac:#4fc3a1;--grid:#2c2c29;--wall:#ecebe6;--sel:#f0997b;--ghost:#5c5952}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
h1{font-size:17px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sm{padding:3px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0;margin-bottom:10px}
.card h2{font-size:12px;margin:0 0 6px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
canvas,#v3{width:100%;height:360px;display:block;border-radius:6px}
#hint{color:var(--mut);font-size:12px;margin:6px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:12px;color:var(--mut)}
input[type=number]{width:70px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input[type=text]{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:12px}
textarea{width:100%;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
#json{height:100px}#ifc{height:90px}
.wrap{overflow-x:auto}
.lvlrow{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.lvlrow:last-child{border-bottom:none}
.lvlrow input[type=text]{width:110px}
.lvlrow .elev{font-size:12px;color:var(--mut);min-width:78px}
.propbox{width:100%;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.propbox .row{margin-bottom:4px}
.propbox textarea{height:44px}
.custrow{display:flex;gap:4px;margin-bottom:4px}
.custrow input{flex:1;min-width:0}
</style></head><body>
<h1>Mini BIM — pemodel gedung sederhana</h1>

<div class="card" id="levelsCard">
<h2>Level / Lantai</h2>
<div id="levelsList"></div>
<div class="row" style="margin-top:8px">
<button id="addLevel">+ Tambah lantai</button>
<label class="row" style="gap:4px"><input type="checkbox" id="ghostChk" checked> Tampilkan level di bawah sebagai referensi</label>
</div>
</div>

<div class="bar" id="tools">
<button data-t="wall" class="on">Dinding</button><button data-t="door">Pintu</button><button data-t="window">Jendela</button><button data-t="column">Kolom</button><button data-t="floor">Lantai</button><button data-t="roof">Atap</button><button data-t="dim">Dimensi</button><button data-t="text">Teks</button><button data-t="section">Garis potongan</button><button data-t="select">Pilih</button>
<button id="del">Hapus terpilih</button><button id="clear">Kosongkan level ini</button>
<span class="row"><label>Tinggi dinding baru</label><input type="number" id="gh" value="3" step="0.1" min="1"><label>Tebal</label><input type="number" id="gt" value="0.2" step="0.05" min="0.05"></span>
</div>
<div class="grid">
<div class="card"><h2>Denah (2D) — <span id="curLvlLbl"></span></h2><canvas id="plan"></canvas><p id="hint"></p><div id="props"></div></div>
<div class="card"><h2>Model 3D / Tampak / Potongan</h2>
<div class="row" id="viewTools">
<button data-v="3d" class="on">3D</button><button data-v="front">Depan</button><button data-v="back">Belakang</button><button data-v="left">Kiri</button><button data-v="right">Kanan</button><button data-v="section">Potongan</button>
<button id="flipSec" class="sm">Balik arah potongan</button>
</div>
<p id="viewMsg" style="color:var(--mut);font-size:12px;margin:4px 0 6px"></p>
<div id="v3"></div></div>
</div>
<div class="grid">
<div class="card wrap"><h2>Schedule / kuantitas</h2><div id="sched"></div></div>
<div class="card wrap"><h2>Daftar elemen & informasi</h2><div id="elist"></div></div>
</div>
<div class="grid">
<div class="card"><h2>Data (JSON)</h2><textarea id="json" spellcheck="false"></textarea><div class="row" style="margin-top:6px"><button id="exp">Ekspor ke kotak</button><button id="imp">Muat dari kotak</button></div></div>
<div class="card"><h2>Ekspor IFC</h2><div class="row"><button id="ifcb">Ekspor IFC</button><button id="ifcc">Salin IFC</button></div><p id="ifcs" style="color:var(--mut);font-size:12px;margin:6px 0"></p><textarea id="ifc" spellcheck="false" readonly placeholder="Hasil IFC muncul di sini"></textarea></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const S={levels:[{id:1,name:'Lantai 1',height:3.5},{id:2,name:'Lantai 2',height:3}],walls:[],ops:[],slabs:[],cols:[],dims:[],notes:[],section:null,id:3,cur:1};
let tool='wall',start=null,hover=null,sel=null;
const $=id=>document.getElementById(id),snap=v=>Math.round(v*2)/2;
const WX=24,WY=16;
function sample(){
const w1=[0,0,8,0],w2=[8,0,8,6],w3=[8,6,0,6],w4=[0,6,0,0];
const mk=(a,b,lv,h)=>({id:S.id++,levelId:lv,a:[a[0]+2,a[1]+2],b:[b[0]+2,b[1]+2],h,t:.2,info:null});
const L1=[mk(w1.slice(0,2),w1.slice(2),1,3.5),mk(w2.slice(0,2),w2.slice(2),1,3.5),mk(w3.slice(0,2),w3.slice(2),1,3.5),mk(w4.slice(0,2),w4.slice(2),1,3.5)];
const L2=[mk(w1.slice(0,2),w1.slice(2),2,3),mk(w2.slice(0,2),w2.slice(2),2,3),mk(w3.slice(0,2),w3.slice(2),2,3),mk(w4.slice(0,2),w4.slice(2),2,3)];
S.walls=[...L1,...L2];
S.ops=[{id:S.id++,levelId:1,wall:L1[0].id,d:2.5,type:'door',w:.9,h:2.1,sill:0,info:null},
{id:S.id++,levelId:1,wall:L1[1].id,d:3,type:'window',w:1.5,h:1.2,sill:.9,info:null},
{id:S.id++,levelId:2,wall:L2[1].id,d:3,type:'window',w:1.5,h:1.2,sill:.9,info:null}];
S.slabs=[{id:S.id++,levelId:1,kind:'floor',a:[2,2],b:[10,8],t:.2,elev:0,rise:0,over:0,info:null},
{id:S.id++,levelId:2,kind:'roof',a:[2,2],b:[10,8],t:.15,elev:3,rise:1.5,over:.4,info:null}];
S.cols=[{id:S.id++,levelId:1,pos:[2,2],w:.3,d:.3,h:3.5,elev:0,info:null},{id:S.id++,levelId:1,pos:[10,2],w:.3,d:.3,h:3.5,elev:0,info:null}];
S.dims=[{id:S.id++,levelId:1,a:[2,2],b:[10,2],off:.5}];
S.notes=[{id:S.id++,levelId:1,pos:[4.5,9],text:'Contoh keterangan'}];
S.section={a:[6,-1],b:[6,9],flip:false};
}
try{const j=localStorage.getItem('minibim');if(j){Object.assign(S,JSON.parse(j));migrate()}else sample()}catch(e){sample()}
function migrate(){
if(!S.levels||!S.levels.length){S.levels=[{id:1,name:'Lantai 1',height:+($('gh')?$('gh').value:3)||3}];S.cur=1;
for(const w of S.walls)w.levelId=1;for(const o of S.ops)o.levelId=1;for(const s of S.slabs)s.levelId=1;}
if(!S.cols)S.cols=[];if(!S.dims)S.dims=[];if(!S.notes)S.notes=[];if(S.section===undefined)S.section=null;
for(const w of S.walls)if(w.info===undefined)w.info=null;
for(const o of S.ops)if(o.info===undefined)o.info=null;
for(const s of S.slabs)if(s.info===undefined)s.info=null;
if(!S.cur||!S.levels.find(l=>l.id===S.cur))S.cur=S.levels[0].id;
}
migrate();
function save(){try{localStorage.setItem('minibim',JSON.stringify(S))}catch(e){}}
const rect=s=>[Math.min(s.a[0],s.b[0]),Math.min(s.a[1],s.b[1]),Math.max(s.a[0],s.b[0]),Math.max(s.a[1],s.b[1])];
const len=w=>Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]);
const wallOf=id=>S.walls.find(w=>w.id===id);
function curLevel(){return S.levels.find(l=>l.id===S.cur)}
function levelElev(id){let e=0;for(const lv of S.levels){if(lv.id===id)return e;e+=lv.height}return e}
function levelBelowOf(id){const i=S.levels.findIndex(l=>l.id===id);return i>0?S.levels[i-1]:null}
function proj(p,w){const L=len(w),ux=(w.b[0]-w.a[0])/L,uy=(w.b[1]-w.a[1])/L;let d=(p[0]-w.a[0])*ux+(p[1]-w.a[1])*uy;d=Math.max(0,Math.min(L,d));
return{d,dist:Math.hypot(w.a[0]+ux*d-p[0],w.a[1]+uy*d-p[1]),ux,uy}}
// ---------- levels UI ----------
function renderLevels(){
const el=$('levelsList');el.innerHTML='';
S.levels.slice().reverse().forEach(lv=>{
const row=document.createElement('div');row.className='lvlrow';
const active=lv.id===S.cur;
row.innerHTML=`<button class="sm ${active?'on':''}" data-act="${lv.id}">${active?'● Aktif':'Aktifkan'}</button>`;
const nm=document.createElement('input');nm.type='text';nm.value=lv.name;nm.onchange=()=>{lv.name=nm.value||lv.name;save();renderLevels()};
const hl=document.createElement('label');hl.textContent='Tinggi';
const hi=document.createElement('input');hi.type='number';hi.step='0.1';hi.min='0.5';hi.value=lv.height;
hi.onchange=()=>{lv.height=Math.max(.5,+hi.value);commit()};
const ev=document.createElement('span');ev.className='elev';ev.textContent='Elev '+levelElev(lv.id).toFixed(2)+' m';
const del=document.createElement('button');del.className='sm';del.textContent='Hapus';del.disabled=S.levels.length<=1;
del.onclick=()=>{if(S.levels.length<=1)return;if(!confirm('Hapus '+lv.name+' beserta seluruh elemennya?'))return;
S.walls=S.walls.filter(w=>w.levelId!==lv.id);S.ops=S.ops.filter(o=>o.levelId!==lv.id);S.slabs=S.slabs.filter(s=>s.levelId!==lv.id);
S.levels=S.levels.filter(l=>l.id!==lv.id);if(S.cur===lv.id)S.cur=S.levels[0].id;sel=null;commit()};
row.append(nm,hl,hi,ev,del);
row.querySelector('[data-act]').onclick=()=>{S.cur=lv.id;sel=null;$('gh').value=lv.height;commit()};
el.appendChild(row)});
$('curLvlLbl').textContent=curLevel()?curLevel().name:'';
}
$('addLevel').onclick=()=>{const h=+$('gh').value||3;const id=S.id++;S.levels.push({id,name:'Lantai '+(S.levels.length+1),height:h});S.cur=id;sel=null;commit()};
$('ghostChk').onchange=draw;
// ---------- 2D ----------
const cv=$('plan'),cx=cv.getContext('2d');let sc=1;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function curWalls(){return S.walls.filter(w=>w.levelId===S.cur)}
function curSlabs(){return S.slabs.filter(s=>s.levelId===S.cur)}
function curOps(){return S.ops.filter(o=>o.levelId===S.cur)}
function curCols(){return S.cols.filter(c=>c.levelId===S.cur)}
function curDims(){return S.dims.filter(d=>d.levelId===S.cur)}
function curNotes(){return S.notes.filter(n=>n.levelId===S.cur)}
function draw(){const W=cv.clientWidth,H=cv.clientHeight,r=devicePixelRatio||1;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);
sc=Math.min(W/WX,H/WY);cx.clearRect(0,0,W,H);cx.strokeStyle=css('--grid');cx.lineWidth=1;
for(let x=0;x<=WX;x++){cx.beginPath();cx.moveTo(x*sc,0);cx.lineTo(x*sc,WY*sc);cx.stroke()}
for(let y=0;y<=WY;y++){cx.beginPath();cx.moveTo(0,y*sc);cx.lineTo(WX*sc,y*sc);cx.stroke()}
if($('ghostChk').checked){const lb=levelBelowOf(S.cur);if(lb){cx.strokeStyle=css('--ghost');cx.setLineDash([4,3]);cx.lineWidth=2;
for(const w of S.walls.filter(w=>w.levelId===lb.id)){cx.beginPath();cx.moveTo(w.a[0]*sc,w.a[1]*sc);cx.lineTo(w.b[0]*sc,w.b[1]*sc);cx.stroke()}
cx.setLineDash([])}}
for(const s of curSlabs()){const r=rect(s),o=s.kind==='roof'?s.over:0,rf=s.kind==='roof',sl=sel&&sel.k==='s'&&sel.id===s.id,X=(r[0]-o)*sc,Y=(r[1]-o)*sc,W2=(r[2]-r[0]+2*o)*sc,H2=(r[3]-r[1]+2*o)*sc;
cx.fillStyle=rf?'rgba(216,90,48,.12)':'rgba(15,110,86,.12)';cx.strokeStyle=sl?css('--sel'):(rf?'#d85a30':'#0f6e56');cx.lineWidth=sl?2.5:1.5;cx.setLineDash(rf?[8,4]:[]);cx.fillRect(X,Y,W2,H2);cx.strokeRect(X,Y,W2,H2);cx.setLineDash([])}
for(const w of curWalls()){cx.strokeStyle=sel&&sel.k==='w'&&sel.id===w.id?css('--sel'):css('--wall');cx.lineWidth=Math.max(2,w.t*sc);cx.lineCap='butt';
cx.beginPath();cx.moveTo(w.a[0]*sc,w.a[1]*sc);cx.lineTo(w.b[0]*sc,w.b[1]*sc);cx.stroke()}
for(const o of curOps()){const w=wallOf(o.wall);if(!w)continue;const p=proj([0,0],w),ux=p.ux,uy=p.uy,c=[w.a[0]+ux*o.d,w.a[1]+uy*o.d];
cx.strokeStyle=sel&&sel.k==='o'&&sel.id===o.id?css('--sel'):(o.type==='door'?'#c8781e':'#2f8fd8');cx.lineWidth=Math.max(3,w.t*sc*.6);
cx.beginPath();cx.moveTo((c[0]-ux*o.w/2)*sc,(c[1]-uy*o.w/2)*sc);cx.lineTo((c[0]+ux*o.w/2)*sc,(c[1]+uy*o.w/2)*sc);cx.stroke();
cx.strokeStyle=css('--card');cx.lineWidth=1.5;cx.stroke()}
for(const c of curCols()){const sl=sel&&sel.k==='c'&&sel.id===c.id;cx.fillStyle='#6b5a3e';cx.strokeStyle=sl?css('--sel'):'#3d3223';cx.lineWidth=sl?2.5:1.5;
cx.fillRect((c.pos[0]-c.w/2)*sc,(c.pos[1]-c.d/2)*sc,c.w*sc,c.d*sc);cx.strokeRect((c.pos[0]-c.w/2)*sc,(c.pos[1]-c.d/2)*sc,c.w*sc,c.d*sc)}
for(const d of curDims()){const sl=sel&&sel.k==='d'&&sel.id===d.id,dx=d.b[0]-d.a[0],dy=d.b[1]-d.a[1],Ln=Math.hypot(dx,dy)||1,nx=-dy/Ln,ny=dx/Ln,ox=nx*d.off,oy=ny*d.off,
a2=[d.a[0]+ox,d.a[1]+oy],b2=[d.b[0]+ox,d.b[1]+oy];cx.strokeStyle=sl?css('--sel'):css('--fg');cx.lineWidth=1;cx.setLineDash([]);
cx.beginPath();cx.moveTo(d.a[0]*sc,d.a[1]*sc);cx.lineTo(a2[0]*sc,a2[1]*sc);cx.moveTo(d.b[0]*sc,d.b[1]*sc);cx.lineTo(b2[0]*sc,b2[1]*sc);
cx.moveTo(a2[0]*sc,a2[1]*sc);cx.lineTo(b2[0]*sc,b2[1]*sc);cx.stroke();
const mx=(a2[0]+b2[0])/2*sc,my=(a2[1]+b2[1])/2*sc;cx.fillStyle=css('--card');const lbl=Ln.toFixed(2)+' m',tw=cx.measureText(lbl).width;
cx.fillRect(mx-tw/2-3,my-14,tw+6,14);cx.fillStyle=css('--fg');cx.font='11px system-ui';cx.textAlign='center';cx.fillText(lbl,mx,my-3);cx.textAlign='left'}
for(const nt of curNotes()){const sl=sel&&sel.k==='n'&&sel.id===nt.id;cx.font='12px system-ui';const tw=cx.measureText(nt.text).width;
cx.fillStyle=sl?css('--sel'):css('--card');cx.strokeStyle=sl?css('--sel'):css('--line');cx.lineWidth=1;
cx.fillRect(nt.pos[0]*sc,nt.pos[1]*sc-14,tw+8,18);cx.strokeRect(nt.pos[0]*sc,nt.pos[1]*sc-14,tw+8,18);
cx.fillStyle=css('--fg');cx.fillText(nt.text,nt.pos[0]*sc+4,nt.pos[1]*sc-1)}
if(S.section){const{a,b,flip}=S.section,dx=b[0]-a[0],dy=b[1]-a[1],Ln=Math.hypot(dx,dy)||1,ux=dx/Ln,uy=dy/Ln;let nx=uy,ny=-ux;if(flip){nx=-nx;ny=-ny}
cx.strokeStyle='#8a2be2';cx.setLineDash([10,5]);cx.lineWidth=2;cx.beginPath();cx.moveTo(a[0]*sc,a[1]*sc);cx.lineTo(b[0]*sc,b[1]*sc);cx.stroke();cx.setLineDash([]);
const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;cx.beginPath();cx.moveTo(mx*sc,my*sc);cx.lineTo((mx+nx*.8)*sc,(my+ny*.8)*sc);cx.stroke();
cx.fillStyle='#8a2be2';cx.beginPath();cx.arc((mx+nx*.8)*sc,(my+ny*.8)*sc,4,0,7);cx.fill();
cx.font='11px system-ui';cx.fillText('Potongan',mx*sc+6,my*sc-6)}
if(start&&hover&&(tool==='floor'||tool==='roof')){cx.strokeStyle=css('--ac');cx.setLineDash([6,4]);cx.lineWidth=2;cx.strokeRect(start[0]*sc,start[1]*sc,(hover[0]-start[0])*sc,(hover[1]-start[1])*sc);cx.setLineDash([])}
if(start&&hover&&(tool==='wall'||tool==='dim'||tool==='section')){cx.strokeStyle=tool==='section'?'#8a2be2':css('--ac');cx.setLineDash([6,4]);cx.lineWidth=2;cx.beginPath();cx.moveTo(start[0]*sc,start[1]*sc);cx.lineTo(hover[0]*sc,hover[1]*sc);cx.stroke();cx.setLineDash([]);
cx.fillStyle=css('--fg');cx.font='12px system-ui';cx.fillText(Math.hypot(hover[0]-start[0],hover[1]-start[1]).toFixed(2)+' m',hover[0]*sc+8,hover[1]*sc-8)}
if(hover&&(tool==='wall'||tool==='floor'||tool==='roof'||tool==='column'||tool==='dim'||tool==='section')){cx.fillStyle=css('--ac');cx.beginPath();cx.arc(hover[0]*sc,hover[1]*sc,4,0,7);cx.fill()}}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/sc,(e.clientY-r.top)/sc]}
function nearestWall(p,max){let b=null;for(const w of curWalls()){const q=proj(p,w);if(q.dist<max&&(!b||q.dist<b.q.dist))b={w,q}}return b}
cv.addEventListener('pointermove',e=>{const p=pt(e);hover=(tool==='wall'||tool==='floor'||tool==='roof'||tool==='column'||tool==='dim'||tool==='section')?[snap(p[0]),snap(p[1])]:p;draw()});
cv.addEventListener('pointerdown',e=>{const p=pt(e);
if(tool==='wall'){const q=[snap(p[0]),snap(p[1])];if(!start)start=q;else if(q[0]!==start[0]||q[1]!==start[1]){S.walls.push({id:S.id++,levelId:S.cur,a:start,b:q,h:+$('gh').value,t:+$('gt').value,info:null});start=q;commit()}}
else if(tool==='floor'||tool==='roof'){const q=[snap(p[0]),snap(p[1])];if(!start)start=q;else if(q[0]!==start[0]&&q[1]!==start[1]){const rf=tool==='roof';S.slabs.push({id:S.id++,levelId:S.cur,kind:tool,a:start,b:q,t:rf?.15:.2,elev:rf?curLevel().height:0,rise:rf?1.5:0,over:rf?.4:0,info:null});sel={k:'s',id:S.id-1};start=null;commit()}}
else if(tool==='door'||tool==='window'){const n=nearestWall(p,.6);if(n){const dr=tool==='door';S.ops.push({id:S.id++,levelId:S.cur,wall:n.w.id,d:n.q.d,type:tool,w:dr?.9:1.5,h:dr?2.1:1.2,sill:dr?0:.9,info:null});sel={k:'o',id:S.ops[S.ops.length-1].id};commit()}}
else if(tool==='column'){const q=[snap(p[0]),snap(p[1])];S.cols.push({id:S.id++,levelId:S.cur,pos:q,w:.3,d:.3,h:curLevel().height,elev:0,info:null});sel={k:'c',id:S.id-1};commit()}

const u=[e('IFCSIUNIT(*,.LENGTHUNIT.,$,.METRE.)'),e('IFCSIUNIT(*,.AREAUNIT.,$,.SQUARE_METRE.)'),e('IFCSIUNIT(*,.VOLUMEUNIT.,$,.CUBIC_METRE.)')];
const prj=e(`IFCPROJECT(${gid()},$,'Mini BIM',$,$,$,$,(${ctx}),${e(`IFCUNITASSIGNMENT((${u.join(',')}))`)})`);
const spl=lp(null,[0,0,0]),bpl=lp(spl,[0,0,0]);
const site=e(`IFCSITE(${gid()},$,'Site',$,$,${spl},$,$,.ELEMENT.,$,$,$,$,$)`);
const bld=e(`IFCBUILDING(${gid()},$,'Building',$,$,${bpl},$,$,.ELEMENT.,$,$,$)`);
e(`IFCRELAGGREGATES(${gid()},$,$,$,${prj},(${site}))`);e(`IFCRELAGGREGATES(${gid()},$,$,$,${site},(${bld}))`);
const shape=so=>e(`IFCPRODUCTDEFINITIONSHAPE($,$,(${e(`IFCSHAPEREPRESENTATION(${ctx},'Body','SweptSolid',(${so}))`)}))`);
const ext=(pf,d)=>e(`IFCEXTRUDEDAREASOLID(${pf},${a3([0,0,0])},${dr(0,0,1)},${f(d)})`);
const rc=(xd,yd,cx,cy)=>e(`IFCRECTANGLEPROFILEDEF(.AREA.,$,${e(`IFCAXIS2PLACEMENT2D(${p2(cx,cy)},$)`)},${f(xd)},${f(yd)})`);
const matCache={};
function matEnt(name){if(!name)return null;if(matCache[name])return matCache[name];const m=e(`IFCMATERIAL(${esc(name)})`);matCache[name]=m;return m}
function attach(elId,info,defName){
const nm=(info&&info.name)||defName;
if(info&&info.material){const m=matEnt(info.material);e(`IFCRELASSOCIATESMATERIAL(${gid()},$,$,$,(${elId}),${m})`)}
const props=[];if(info&&info.material)props.push(['Material',info.material]);if(info&&info.notes)props.push(['Catatan',info.notes]);
if(info&&info.custom)for(const c of info.custom)if(c.k)props.push([c.k,c.v]);
if(props.length){const pv=props.map(([k,v])=>e(`IFCPROPERTYSINGLEVALUE(${esc(k)},$,IFCLABEL(${esc(v)}),$)`));
const pset=e(`IFCPROPERTYSET(${gid()},$,'MiniBIM_Properties',$,(${pv.join(',')}))`);
e(`IFCRELDEFINESBYPROPERTIES(${gid()},$,$,$,(${elId}),${pset})`)}
return nm}
const storeyOf={};
S.levels.forEach((lv,i)=>{const p=lp(bpl,[0,0,levelElev(lv.id)]);const st=e(`IFCBUILDINGSTOREY(${gid()},$,${esc(lv.name)},$,$,${p},$,$,.ELEMENT.,${f(levelElev(lv.id))})`);storeyOf[lv.id]={id:st,placement:p,els:[]}});
e(`IFCRELAGGREGATES(${gid()},$,$,$,${bld},(${S.levels.map(lv=>storeyOf[lv.id].id).join(',')}))`);
S.walls.forEach((w,i)=>{const st=storeyOf[w.levelId];if(!st)return;const Ln=len(w);if(Ln<.01)return;const ux=(w.b[0]-w.a[0])/Ln,uy=(w.b[1]-w.a[1])/Ln;
const wp=lp(st.placement,[w.a[0],w.a[1],0],[0,0,1],[ux,uy,0]);
const wl=e(`IFCWALL(${gid()},$,${esc('Wall '+(i+1))},$,$,${wp},${shape(ext(rc(Ln,w.t,Ln/2,0),w.h))},$,.STANDARD.)`);
attach(wl,w.info,'Wall '+(i+1));st.els.push(wl);
for(const o of S.ops.filter(o=>o.wall===w.id)){const x0=Math.max(0,o.d-o.w/2),ow=Math.min(Ln,o.d+o.w/2)-x0,oh=Math.min(o.h,w.h-o.sill);if(ow<.01||oh<.01)continue;
const opn=e(`IFCOPENINGELEMENT(${gid()},$,'Opening',$,$,${lp(wp,[x0,0,o.sill])},${shape(ext(rc(ow,w.t+.2,ow/2,0),oh))},$,.OPENING.)`);
e(`IFCRELVOIDSELEMENT(${gid()},$,$,$,${wl},${opn})`);
const isD=o.type==='door';
const el=e(`${isD?'IFCDOOR':'IFCWINDOW'}(${gid()},$,${esc(isD?'Door':'Window')},$,$,${lp(wp,[x0,0,o.sill])},${shape(ext(rc(ow,w.t*.4,ow/2,0),oh))},$,${f(oh)},${f(ow)},${isD?'.DOOR.':'.WINDOW.'},.NOTDEFINED.,$)`);
attach(el,o.info,isD?'Door':'Window');st.els.push(el);e(`IFCRELFILLSELEMENT(${gid()},$,$,$,${opn},${el})`)}});
S.cols.forEach((c,i)=>{const st=storeyOf[c.levelId];if(!st)return;const pl=lp(st.placement,[c.pos[0],c.pos[1],c.elev]);
const nm='Column '+(i+1);const el=e(`IFCCOLUMN(${gid()},$,${esc(nm)},$,$,${pl},${shape(ext(rc(c.w,c.d,0,0),c.h))},$,.COLUMN.)`);attach(el,c.info,nm);st.els.push(el)});
S.slabs.forEach((s,i)=>{const st=storeyOf[s.levelId];if(!st)return;const r=rect(s),rf=s.kind==='roof',o=rf?s.over:0,x0=r[0]-o,y0=r[1]-o,W=r[2]-r[0]+2*o,D=r[3]-r[1]+2*o;let pl,so,pre;
if(rf&&s.rise>0){const ax=W>=D,B=ax?D:W,Ln=ax?W:D;
pl=ax?lp(st.placement,[x0,y0+D/2,s.elev],[1,0,0],[0,1,0]):lp(st.placement,[x0+W/2,y0,s.elev],[0,1,0],[-1,0,0]);
const poly=e(`IFCPOLYLINE((${p2(-B/2,0)},${p2(B/2,0)},${p2(0,s.rise)},${p2(-B/2,0)}))`);
so=ext(e(`IFCARBITRARYCLOSEDPROFILEDEF(.AREA.,$,${poly})`),Ln);pre='.GABLE_ROOF.'}
else{pl=lp(st.placement,[x0,y0,rf?s.elev:s.elev-s.t]);so=ext(rc(W,D,W/2,D/2),s.t);pre=rf?'.FLAT_ROOF.':'.FLOOR.'}
const nm=(rf?'Roof ':'Floor ')+(i+1);
const el=e(`${rf?'IFCROOF':'IFCSLAB'}(${gid()},$,${esc(nm)},$,$,${pl},${shape(so)},$,${pre})`);attach(el,s.info,nm);st.els.push(el)});
for(const lv of S.levels){const st=storeyOf[lv.id];if(st.els.length)e(`IFCRELCONTAINEDINSPATIALSTRUCTURE(${gid()},$,$,$,(${st.els.join(',')}),${st.id})`)}
return "ISO-10303-21;\nHEADER;\nFILE_DESCRIPTION(('ViewDefinition [CoordinationView]'),'2;1');\nFILE_NAME('mini-bim.ifc','"+new Date().toISOString().slice(0,19)+"',('Mini BIM'),(''),'Mini BIM','Mini BIM','');\nFILE_SCHEMA(('IFC4'));\nENDSEC;\nDATA;\n"+L.join('\n')+"\nENDSEC;\nEND-ISO-10303-21;\n"}
$('ifcb').onclick=()=>{if(!S.walls.length&&!S.slabs.length){$('ifcs').textContent='Belum ada elemen untuk diekspor.';return}
const t=buildIFC();$('ifc').value=t;
try{const u=URL.createObjectURL(new Blob([t],{type:'application/octet-stream'})),a=document.createElement('a');a.href=u;a.download='mini-bim.ifc';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(x){}
$('ifcs').textContent='IFC4 dibuat ('+t.split('\n').length+' baris, '+S.levels.length+' level). Jika unduhan tidak berjalan (misalnya di halaman terpublikasi), klik "Salin IFC" lalu tempel ke file bernama mini-bim.ifc.'};
$('ifcc').onclick=async()=>{if(!$('ifc').value)$('ifcb').click();const ta=$('ifc');try{await navigator.clipboard.writeText(ta.value)}catch(x){ta.select();try{document.execCommand('copy')}catch(y){}}$('ifcs').textContent='IFC disalin ke clipboard. Simpan sebagai mini-bim.ifc.'};
addEventListener('resize',()=>{size3();draw()});
$('gh').value=curLevel().height;
hint();size3();draw();build();sched();props();renderLevels();elist();
</script></body></html>
